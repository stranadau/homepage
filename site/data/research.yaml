- en: Statistical damage diagnosis for structural health monitoring
  ko: 구조건전성 모니터링을 위한 통계적 손상 진단
  desc_en: We develop statistical frameworks for deciding whether damage has occurred from measured damage features that are inevitably affected by noise and operational variability. Because such decisions are governed by the tail of the feature distribution, extreme value statistics are used to establish baseline distributions and decision thresholds, including parameter estimation of the generalized extreme value (GEV) distribution and the asymptotic convergence of its domain of attraction. These statistical tools are combined with time-reversal processes to enable baseline-free damage diagnosis through consecutive outlier analysis.
  desc_ko: 계측된 손상 지표는 잡음과 운용 환경 변화의 영향을 피할 수 없으므로, 이로부터 손상 발생 여부를 통계적으로 판정하는 기법을 연구합니다. 손상 판정은 지표 분포의 꼬리 영역에 의해 좌우되므로, 극치 통계(extreme value statistics)를 이용하여 기준 분포와 판정 임계값을 설정하며, 이를 위해 일반화 극치(GEV) 분포의 파라미터 추정과 흡인 영역(domain of attraction)의 점근 수렴 특성을 다룹니다. 또한 이러한 통계 기법을 시간역전 과정과 결합하여, 연속 이상치 분석(consecutive outlier analysis)을 통한 기준 데이터 없는(baseline-free) 손상 진단을 구현합니다.
  subs:
  - en: Extreme value statistics for establishing baseline distributions
    ko: 기준 분포 설정을 위한 극치 통계
    papers:
    - title: Parameter estimation of the generalized extreme value distribution for structural health monitoring
      venue: Probabilistic Engineering Mechanics
      year: 2006
      url: https://doi.org/10.1016/j.probengmech.2005.11.009
    - title: Understanding the asymptotic convergence of domain of attraction in extreme value distribution for establishing baseline distribution in statistical damage assessment of a structure
      venue: Journal of the Korea Institute for Structural Maintenance and Inspection
      year: 2009
      url: https://www.kci.go.kr/kciportal/ci/sereArticleSearch/ciSereArtiView.kci?sereArticleSearchBean.artiId=ART001330841
  - en: Baseline-free damage diagnosis via time reversal and consecutive outlier analysis
    ko: 시간역전과 연속 이상치 분석을 이용한 기준 데이터 없는 손상 진단
    papers:
    - title: Combination of a time reversal process and a consecutive outlier analysis for baseline-free damage diagnosis
      venue: Journal of Intelligent Material Systems and Structures
      year: 2007
      url: https://doi.org/10.1177/1045389X06066291
  short_ko: 극치 통계와 이상치 분석으로 손상 발생을 통계적으로 판정합니다.
  short_en: Extreme-value statistics and outlier analysis for damage decisions.
  icon: chart
- en: Inverse problems and system identification
  ko: 역문제 및 시스템 식별
  desc_en: We develop numerically stable inverse-analysis and system-identification methods to infer structural parameters and states from limited, noise-contaminated measurements. Emphasis is placed on regularization design (Tikhonov, 1-norm, and spatial regularization) and on the rational selection of regularization parameters. Applications include the identification of inclusions in finite bodies, the detection of abrupt damage induced by an earthquake using a moving time window, and the reconstruction of displacement from measured acceleration in low-frequency dominant structures.
  desc_ko: 잡음이 포함된 제한된 계측 데이터로부터 구조물의 파라미터와 상태를 추정하기 위한, 수치적으로 안정한 역해석 및 시스템 식별 기법을 연구합니다. 특히 정규화 기법(Tikhonov, 1-norm, 공간 정규화)의 설계와 정규화 계수의 합리적 결정에 중점을 둡니다. 적용 대상은 유한 물체 내 개재물의 식별, 이동 시간창(moving time window)을 이용한 지진 시 급격한 손상의 탐지, 저주파 성분이 지배적인 구조물에서 계측 가속도로부터의 변위 재구성 등입니다.
  subs:
  - en: Displacement reconstruction from acceleration
    ko: 가속도로부터의 변위 재구성
    papers:
    - title: Design of an FIR filter for the displacement reconstruction using measured acceleration in low-frequency dominant structures
      venue: International Journal for Numerical Methods in Engineering
      year: 2010
      url: https://doi.org/10.1002/nme.2769
  - en: Detection of abrupt structural damage using a moving time window
    ko: 이동 시간창을 이용한 급격한 구조 손상 탐지
    papers:
    - title: Detection of abrupt structural damage induced by an earthquake using a moving time window technique
      venue: Computers &amp; Structures
      year: 2008
      url: https://doi.org/10.1016/j.compstruc.2007.11.003
  - en: Regularization-aware system identification
    ko: 정규화 기반 시스템 식별
    groups:
    - en: 1-norm regularization for discontinuous / localized system parameters
      ko: 불연속 / 국부적 시스템 파라미터를 위한 1-norm 정규화
      papers:
      - title: 1-norm based regularization scheme for system identification of structures with discontinuous system parameters
        venue: International Journal for Numerical Methods in Engineering
        year: 2007
        url: https://doi.org/10.1002/nme.1778
    - en: Optimal selection of the Tikhonov regularization factor for linear elastic continua
      ko: 선형 탄성 연속체에 대한 최적 Tikhonov 정규화 계수 결정
      papers:
      - title: Determination of an optimal regularization factor in system identification with Tikhonov regularization for linear elastic continua
        venue: International Journal for Numerical Methods in Engineering
        year: 2001
        url: https://doi.org/10.1002/nme.219
  - en: Inverse identification of inclusions (geometry and material properties)
    ko: 개재물의 역식별(형상 및 재료 물성)
    groups:
    - en: Boundary parameterization for simultaneous identification of inclusion shape and material properties
      ko: 경계 매개변수화를 이용한 개재물 형상과 재료 물성의 동시 식별
      papers:
      - title: Identification of geometric shapes and material properties of inclusions in two-dimensional finite bodies by boundary parameterization
        venue: Computer Methods in Applied Mechanics and Engineering
        year: 2000
        url: https://doi.org/10.1016/S0045-7825(99)00165-6
    - en: Spatial regularization for stable identification of inclusion geometry
      ko: 개재물 형상의 안정적 식별을 위한 공간 정규화
      papers:
      - title: A new spatial regularization scheme for the identification of the geometric shape of an inclusion in a finite body
        venue: International Journal for Numerical Methods in Engineering
        year: 1999
        url: https://doi.org/10.1002/(SICI)1097-0207(19991110)46:7%3C973::AID-NME730%3E3.0.CO;2-Q
  short_ko: 정규화 기반 역해석으로 계측 데이터에서 구조 물성과 상태를 추정합니다.
  short_en: Regularized inverse analysis and system identification from measurements.
  icon: target
