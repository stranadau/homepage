  short_ko: 역학 법칙을 학습에 결합해 적은 데이터로 균열과 구조 거동을 예측합니다.
  short_en: Embedding mechanics in learning to assess cracks and predict behavior from sparse data.
  icon: brain
- en: 'Prestressed concrete (PSC) structures: time-dependent behavior and measurement-driven calibration'
  ko: '프리스트레스트 콘크리트(PSC) 구조물: 시간의존적 거동 및 계측 기반 보정'
  desc_en: 'We develop models and estimation procedures for the initial and long-term states of prestressed concrete members, whose effective prestress and camber are governed by construction conditions and by time-dependent creep, shrinkage, and relaxation. Mechanics-based formulations of time-dependent prestress loss are combined with field measurements: tendon elongation is used to estimate the tendon force and friction coefficients that define the initial state of post-tensioned members, and strain measurements are used to reconstruct camber, which is difficult to measure directly.'
  desc_ko: 프리스트레스트 콘크리트 부재의 유효 프리스트레스와 솟음(camber)은 시공 조건과 크리프&middot;건조수축&middot;릴랙세이션에 따른 시간의존적 거동에 의해 결정됩니다. 본 연구에서는 시간의존적 프리스트레스 손실에 대한 역학 기반 정식화와 현장 계측 데이터를 결합하여 부재의 초기 상태와 장기 거동을 추정합니다. 긴장재 신장량으로부터 긴장력과 마찰계수를 추정하여 포스트텐션 부재의 초기 상태를 합리적으로 결정하고, 변형률 계측으로부터 직접 계측하기 어려운 솟음을 재구성합니다.
  subs:
  - en: Estimating the initial state of post-tensioned members from field measurement data
    ko: 현장 계측 데이터를 이용한 포스트텐션 부재의 초기 상태 추정
    papers:
    - title: Rational estimation of initial state of post-tensioned concrete beams using field measurement data
      venue: International Journal of Concrete Structures and Materials
      year: 2026
      url: https://doi.org/10.1186/s40069-026-00910-8
  - en: Time-dependent prestress loss via the Volterra integral equation
    ko: Volterra 적분방정식 기반 시간의존적 프리스트레스 손실 추정
    papers:
    - title: Finite difference equation of Volterra integral equation for estimating the time-dependent prestress loss of a prestressed concrete beam
