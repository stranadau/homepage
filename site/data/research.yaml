  short_ko: 현장 계측으로 PSC 부재의 초기 긴장력, 마찰계수, 솟음을 추정합니다.
  short_en: Estimating prestress, friction and camber of PSC members from field measurements.
  icon: bridge
- en: Guided wave propagation using surface-bonded piezoelectric wafers
  ko: 표면 부착형 압전 웨이퍼를 이용한 유도파 전파
  desc_en: We investigate the excitation, propagation, and scattering of guided waves generated and sensed by surface-bonded piezoelectric (PZT) wafers for active structural health monitoring. The work includes time-reversal processes of Lamb waves, reference-free damage diagnosis based on electromechanical signals, efficient spectral element modeling of coupled PZT&ndash;structure systems, and wave-based interpretation of electromechanical admittance. The same sensing principle has recently been extended to in-situ monitoring of the evolution of dynamic properties in cement-based materials.
  desc_ko: 표면 부착형 압전(PZT) 웨이퍼로 가진&middot;계측하는 유도파(guided wave)의 발생, 전파, 산란을 연구하여 능동형 구조건전성 모니터링(SHM)에 활용합니다. 주요 내용은 Lamb파의 시간역전(time reversal) 과정, 전기-기계 신호에 기반한 기준신호 없는(reference-free) 손상 진단, PZT&ndash;구조물 연성계의 효율적인 스펙트럴 요소 모델링, 전기-기계 어드미턴스의 파동 기반 해석입니다. 최근에는 동일한 계측 원리를 시멘트계 재료의 동적 물성 변화를 현장에서 추적하는 데까지 확장하고 있습니다.
  subs:
  - en: Time-reversal guided waves (Lamb waves)
    ko: 시간역전 유도파(Lamb파)
    groups:
