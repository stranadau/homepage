        url: https://doi.org/10.1016/j.jsv.2012.12.030
  - en: Reference-free damage diagnosis with PZT wafers (impedance / electromechanical signals)
    ko: PZT 웨이퍼를 이용한 기준신호 없는 손상 진단(임피던스 / 전기-기계 신호)
