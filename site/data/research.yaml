topics:
- en: Modal and wave behaviors of a Timoshenko beam with an edge crack
  ko: 모서리 균열을 갖는 Timoshenko 보의 모드 및 파동 거동
  desc_en: We develop analytical and semi-analytical formulations for the modal and wave behaviors of beam-like waveguides with an edge crack, for which <i>shear deformation</i> and <i>rotary inertia</i> require a Timoshenko-type description. The crack is represented by a local compliance derived from linear elastic fracture mechanics (LEFM). At the wave level, closed-form scattering coefficients are derived under axial&ndash;bending&ndash;shear coupling for both propagating and evanescent incident waves, and their consistency is verified through the power-flux balance. At the modal level, wave-based descriptions yield explicit frequency equations that clarify when and why the sensitivity of modal frequencies to a crack increases, providing a basis for both forward prediction and inverse crack identification.
  desc_ko: 전단 변형(<i>shear deformation</i>)과 회전 관성(<i>rotary inertia</i>)으로 인해 Timoshenko 보 모델이 요구되는 보형 도파관을 대상으로, 모서리 균열에 의한 모드 거동과 파동 거동의 변화를 해석적&middot;준해석적 정식화로 규명합니다. 균열은 선형탄성파괴역학(LEFM)에 기반한 국부 유연도로 모델링합니다. 파동 관점에서는 축방향&ndash;휨&ndash;전단 연성 조건에서 전파파와 소산파(evanescent wave) 입사 모두에 대한 산란계수를 닫힌 형태로 유도하고, 파워 플럭스 평형(power-flux balance)을 통해 그 정합성을 검증합니다. 모드 관점에서는 파동 기반 기술로부터 명시적인 진동수 방정식을 유도하여 균열에 대한 고유진동수의 민감도가 언제, 왜 커지는지를 규명하고, 이를 순방향 예측과 균열 역식별의 기반으로 활용합니다.
  subs:
  - en: Closed-form wave scattering coefficients under axial&ndash;bending&ndash;shear coupling
    ko: 축방향&ndash;휨&ndash;전단 연성을 고려한 파동 산란계수의 닫힌 형태 해
    papers:
    - title: 'Closed-form scattering coefficients for incident axial and evanescent bending waves in edge-cracked Timoshenko beams: Completion of the 18-coefficient scattering matrix'
