- en: Physics-informed machine learning for engineering structures
  ko: 공학 구조물을 위한 물리 정보 기반 머신러닝
  desc_en: We develop physics-informed learning frameworks for structural problems in which the governing equations are known but prediction and parameter estimation become ill-posed under sparse or noisy measurements. Mechanical constraints and evolution laws are embedded in the learning process to obtain data-efficient and physically consistent models for response prediction and state/parameter inference. Current applications include the time-dependent behavior of prestressed concrete members and the assessment of multiple incipient cracks from broadband modal frequencies measured with piezoelectric wafers.
  desc_ko: 지배방정식은 알려져 있으나 계측 데이터가 희소하거나 잡음을 포함하여 응답 예측과 파라미터 추정이 불량조건(ill-posed)이 되는 구조 문제를 대상으로, 물리 정보 기반(physics-informed) 학습 기법을 개발합니다. 역학적 제약 조건과 시간 발전 법칙을 학습 과정에 반영하여, 적은 데이터로도 물리적으로 일관된 응답 예측과 상태&middot;파라미터 추정이 가능한 모델을 구축합니다. 현재 프리스트레스트 콘크리트 부재의 시간의존적 거동 예측과, 압전 웨이퍼로 계측한 광대역 고유진동수를 이용한 다중 미세 균열 평가에 적용하고 있습니다.
  subs:
  - en: Physics-informed neural networks (PINNs) for time-dependent behavior of prestressed concrete (PSC) members
    ko: PSC 부재의 시간의존적 거동 예측을 위한 물리 정보 신경망(PINN)
    papers:
    - title: Predicting the early-age time-dependent behaviors of a prestressed concrete beam by using physics-informed neural network
      venue: Sensors
      year: 2023
      url: https://doi.org/10.3390/s23146649
  - en: Physics-informed ML-assisted crack assessment using broadband modal frequencies from PZT wafers
    ko: PZT 웨이퍼 광대역 고유진동수를 이용한 물리 정보 기반 ML 균열 평가
    papers:
