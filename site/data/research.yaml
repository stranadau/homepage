      url: https://doi.org/10.1016/j.wavemoti.2026.103801
    - title: Closed-form solutions for wave scattering coefficients of a Timoshenko beam with an edge crack considering axial&ndash;bending&ndash;shear coupling
      venue: Applied Mathematical Modelling
      year: 2026
      url: https://doi.org/10.1016/j.apm.2026.116748
    - title: Determination of wave scattering coefficients in an infinite elastic waveguide with a crack considering axial&ndash;bending coupling
      venue: KSCE Journal of Civil and Environmental Engineering Research
      year: 2025
      url: https://doi.org/10.12652/Ksce.2025.45.1.0013
