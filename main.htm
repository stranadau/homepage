<script language=JavaScript> 

function notice_getCookie( name ){
    var nameOfCookie = name + "=";
    var x = 0;
    while ( x <= document.cookie.length )
    {
            var y = (x+nameOfCookie.length);
            if ( document.cookie.substring( x, y ) == nameOfCookie ) {
                    if ( (endOfCookie=document.cookie.indexOf( ";", y )) == -1 )
                            endOfCookie = document.cookie.length;
                    return unescape( document.cookie.substring( y, endOfCookie ) );
            }
            x = document.cookie.indexOf( " ", x ) + 1;
            if ( x == 0 )
                    break;
    }
    return "";
}

<script type="text/javascript">
(function () {
  var hero = document.getElementById('hero'); if (!hero) return;
  var tabs = hero.getElementsByTagName('button');
  var slides = hero.getElementsByTagName('a');
  var cur = 0, timer = null, paused = false;
  function show(i) {
    cur = i;
    for (var k = 0; k < slides.length; k++) {
      slides[k].className = (k === i) ? 'on' : '';
      tabs[k].className = (k === i) ? 'on' : '';
      tabs[k].setAttribute('aria-selected', k === i ? 'true' : 'false');
    }
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } }
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) timer = setInterval(function () { if (!paused) show((cur + 1) % slides.length); }, 10000);
  for (var k = 0; k < tabs.length; k++) {
    tabs[k].onclick = (function (i) { return function () { stop(); show(i); }; })(k);
  }
  hero.onmouseover = function () { paused = true; };
  hero.onmouseout = function () { paused = false; };
})();
</script>
